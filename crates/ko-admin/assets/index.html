<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JstKO Yönetim Paneli</title>
<style>
:root{
  --bg:#12100c;--bg2:#1a1612;--panel:#211b14;--panel2:#2a2218;--line:#4b3c24;--line2:#6b5630;
  --gold:#e0ad4a;--gold2:#f3d27a;--text:#eadfc8;--mute:#a79776;--red:#d05a4a;--green:#6fbf73;--blue:#5b8fd6;--karus:#d06a4a;--elmo:#5b8fd6;
  --slot:46px;--r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 20% -10%,#2a2113 0,transparent 60%),var(--bg)}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#16120d;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
button{background:linear-gradient(#3a2d19,#2a2013);border:1px solid var(--line2);color:var(--gold2);border-radius:var(--r);padding:7px 13px;cursor:pointer}
button:hover{background:linear-gradient(#4a3920,#33261a)}
button.primary{background:linear-gradient(#8a6420,#5f4313);color:#fff6dc;border-color:var(--gold)}
button.danger{background:linear-gradient(#6a2a22,#481a15);border-color:#a5473a;color:#ffd9d2}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{margin:0 0 .5em;font-weight:600;color:var(--gold2)}
h2{font-size:18px}h3{font-size:15px}
.mut{color:var(--mute)}.sm{font-size:12px}.right{margin-left:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:linear-gradient(var(--panel),var(--bg2));border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 2px 0 #0008}
.grid{display:grid;gap:12px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-size:24px;color:var(--gold2)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);font-size:12px}
.pill.on{border-color:var(--green);color:var(--green)}.pill.off{border-color:var(--red);color:var(--red)}
.pill.karus{border-color:var(--karus);color:var(--karus)}.pill.elmo{border-color:var(--elmo);color:var(--elmo)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;border-bottom:1px solid #3a2e1c;text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr.click{cursor:pointer}tr.click:hover{background:#2c2316}
.tablewrap{overflow:auto;max-width:100%}
/* shell */
#app{display:none;min-height:100%}
#app.on{display:grid;grid-template-columns:220px 1fr;grid-template-rows:54px 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(#2c2316,#1a150e);border-bottom:1px solid var(--line2)}
header .brand{font-weight:700;color:var(--gold2);letter-spacing:.06em}
header .burger{display:none}
nav{background:var(--bg2);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
nav a{display:block;padding:9px 12px;border-radius:var(--r);color:var(--text);text-decoration:none;margin-bottom:2px;border:1px solid transparent}
nav a:hover{background:#2a2113}
nav a.on{background:#3a2c15;border-color:var(--line2);color:var(--gold2)}
main{padding:16px;overflow:auto;min-width:0}
#login{display:none;min-height:100%;align-items:center;justify-content:center;padding:16px}
#login.on{display:flex}
#login form{width:min(380px,100%)}
#login label{display:block;margin:10px 0 4px}
#login input{width:100%}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.bad{background:var(--red)}
/* toast + modal */
#toasts{position:fixed;right:12px;bottom:12px;display:grid;gap:8px;z-index:99}
.toast{background:#2a2113;border:1px solid var(--line2);padding:10px 14px;border-radius:var(--r);max-width:340px}
.toast.err{border-color:var(--red);color:#ffd2cb}.toast.ok{border-color:var(--green)}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.modal{background:linear-gradient(var(--panel2),var(--bg2));border:1px solid var(--gold);border-radius:12px;width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;padding:16px}
.modal.wide{width:min(820px,100%)}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
.form input,.form select{color:var(--text);font-size:14px}
/* item slots */
.panelbox{background:linear-gradient(#26200f,#17130b);border:1px solid var(--line2);border-radius:10px;padding:10px}
.panelbox h3{font-size:13px;margin:0 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.slots{display:grid;gap:3px;justify-content:start}
.slot{width:var(--slot);height:var(--slot);aspect-ratio:1;background:#0d0a07;border:1px solid #3d321f;border-radius:4px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
.slot:hover{border-color:var(--gold)}
.slot.full{background:#17120b;border-color:#6b5630}
.slot img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.slot .cnt{position:absolute;right:2px;bottom:0;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
.slot .flag{position:absolute;left:2px;top:1px;font-size:10px;color:var(--gold2);text-shadow:0 0 3px #000;pointer-events:none}
.slot .num{position:absolute;left:2px;bottom:0;font-size:9px;color:#7d6c49;pointer-events:none}
.slot.full .num{display:none}
.slot.sel{outline:2px solid var(--gold2);outline-offset:-2px}
.slot.over{outline:2px dashed var(--green);outline-offset:-2px;background:#1c2a1d}
.slot.locked{opacity:.8}
.slot.none{visibility:hidden}
.slot.eq-label::after{content:attr(data-label);position:absolute;top:1px;left:0;right:0;text-align:center;font-size:8.5px;color:#6f5f3d;pointer-events:none}
.slot.full.eq-label::after{display:none}
.invwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.eqgrid{grid-template-columns:repeat(3,var(--slot))}
.bag7{grid-template-columns:repeat(7,var(--slot))}
.bag3{grid-template-columns:repeat(3,var(--slot))}
.bag6{grid-template-columns:repeat(6,var(--slot))}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{padding:5px 11px;font-size:13px}
.tabs button.on{background:linear-gradient(#8a6420,#5f4313);color:#fff6dc}
.picker{width:300px;max-width:100%}
.picker .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;margin-top:8px;max-height:340px;overflow:auto}
.picker .res .slot{width:auto;height:auto}
.banner{background:#2d3d1f;border:1px solid var(--green);padding:6px 10px;border-radius:var(--r);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.itemcard{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.itemcard .slot{width:64px;height:64px;flex:none;cursor:default}
.itemcard dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0;font-size:12px}
.itemcard dt{color:var(--mute)}.itemcard dd{margin:0}
.dropcard{margin-bottom:10px}
.dropslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.dslot{display:flex;gap:6px;align-items:center;background:#17120b;border:1px solid #4a3c22;border-radius:6px;padding:4px;cursor:pointer;min-width:0}
.dslot:hover{border-color:var(--gold)}
.dslot.empty{opacity:.55}
.dslot .slot{width:34px;height:34px;flex:none;cursor:pointer}
.dslot div{font-size:11px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{background:#23190c;border-left:3px solid var(--gold);padding:8px 10px;border-radius:4px;font-size:12px;color:var(--mute)}
@media (max-width:900px){
  #app.on{grid-template-columns:1fr}
  header{grid-column:1}
  header .burger{display:inline-block}
  nav{position:fixed;left:0;top:54px;bottom:0;width:230px;z-index:30;transform:translateX(-100%);transition:transform .15s}
  nav.open{transform:none;box-shadow:0 0 0 100vmax #0008}
  :root{--slot:40px}
  main{padding:10px}
  #srv,#clock{display:none}
  header .brand{font-size:12px}
}
@media (max-width:480px){:root{--slot:36px}}
</style>
</head>
<body>
<div id="login">
  <form class="card" id="loginForm">
    <h1>JstKO Yönetim Paneli</h1>
    <p class="mut sm">Yönetici hesabınızla giriş yapın. Bu panel doğrudan veritabanına bağlıdır; oyun sunucusu kapalıyken de çalışır.</p>
    <label for="lu">Kullanıcı adı</label><input id="lu" autocomplete="username" required>
    <label for="lp">Parola</label><input id="lp" type="password" autocomplete="current-password" required>
    <p style="margin-top:14px"><button class="primary" type="submit" style="width:100%">Giriş yap</button></p>
  </form>
</div>
<div id="app">
  <header>
    <button class="burger ghost" id="burger" aria-label="Menü">☰</button>
    <span class="brand">JSTKO · YÖNETİM</span>
    <span class="mut sm" id="srv"></span>
    <span class="right mut sm" id="clock"></span>
    <span class="pill" id="who"></span>
    <button class="ghost" id="logout">Çıkış</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<script>
'use strict';
const BASE='/jstkoadminpanel';
const API=BASE+'/api';
let csrf='',actor='';
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v===false||v==null)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k==='dataset')Object.assign(e.dataset,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e;
}
const clear=e=>{while(e.firstChild)e.removeChild(e.firstChild);return e};
const fmt=n=>Number(n||0).toLocaleString('tr-TR');
const when=s=>s?new Date(s).toLocaleString('tr-TR'):'—';
function toast(msg,kind){
  const t=h('div',{class:'toast '+(kind||'')},msg);$('#toasts').append(t);setTimeout(()=>t.remove(),kind==='err'?7000:3500);
}
async function api(path,opt={}){
  const r=await fetch(API+path,{method:opt.method||(opt.body?'POST':'GET'),credentials:'same-origin',
    headers:{'Content-Type':'application/json','x-admin-csrf':csrf},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===204)return null;
  let d=null;try{d=await r.json()}catch(_){}
  if(r.status===401){showLogin();throw new Error('auth')}
  if(!r.ok){
    const m=(d&&d.error)||('Hata '+r.status);
    if(!opt.quiet)toast(m,'err');
    const e=new Error(m);e.status=r.status;throw e;
  }
  return d;
}
function modal(title,body,buttons,wide){
  const ov=h('div',{class:'overlay'});
  const close=()=>ov.remove();
  const m=h('div',{class:'modal'+(wide?' wide':''),role:'dialog','aria-label':title},
    h('h2',{},title),body,
    buttons&&buttons.length?h('div',{class:'btns'},buttons.map(b=>h('button',{class:b.cls||'',onclick:async()=>{
      if(b.fn){const keep=await b.fn(close);if(keep===true)return}
      if(!b.keep)close()
    }},b.label))):null);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  ov.append(m);document.body.append(ov);
  const f=m.querySelector('input,select');if(f)f.focus();
  return close;
}
const debounce=(fn,ms=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const icon=id=>BASE+'/icons/'+(id||0)+'.jpg';
const NATION={1:['Karus','karus'],2:['El Morad','elmo']};
function nationPill(n){const x=NATION[n]||['?',''];return h('span',{class:'pill '+x[1]},x[0])}
function className(c){
  const m=c%100,side=c>=200?'EM ':'KR ';
  const job=[1,5,6].includes(m)?'Savaşçı':[2,7,8].includes(m)?'Rogue':[3,9,10].includes(m)?'Büyücü':[4,11,12].includes(m)?'Rahip':m>=13?'Kurian/Portu':'?';
  return job+' ('+c+')';
}
/* ───────── routing & shell ───────── */
const PAGES=[
  ['dashboard','Genel Bakış'],['players','Hesaplar & Oyuncular'],['drops','Drop Editörü'],
  ['events','Etkinlik Merkezi'],['letters','Mektup / Ödül'],['system','Sistem & Yöneticiler'],['audit','Denetim Kaydı']
];
function buildNav(){
  const nav=clear($('#nav'));
  for(const [id,label] of PAGES)nav.append(h('a',{href:'#/'+id,'data-p':id},label));
}
async function route(){
  const parts=(location.hash.replace(/^#\//,'')||'dashboard').split('/').map(decodeURIComponent);
  const page=parts[0];
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===page||(page==='account'||page==='char')&&a.dataset.p==='players'));
  $('#nav').classList.remove('open');
  const main=clear($('#main'));
  const fn={dashboard:pageDashboard,players:pagePlayers,account:pageAccount,char:pageChar,drops:pageDrops,events:pageEvents,letters:pageLetters,system:pageSystem,audit:pageAudit}[page]||pageDashboard;
  try{await fn(main,parts.slice(1))}catch(e){if(e.message!=='auth')main.append(h('p',{class:'mut'},'Sayfa yüklenemedi: '+e.message))}
}
function showLogin(){$('#app').classList.remove('on');$('#login').classList.add('on')}
async function enter(d){
  csrf=d.csrf;actor=d.actor;
  $('#login').classList.remove('on');$('#app').classList.add('on');
  $('#who').textContent=actor;buildNav();route();pingServer();
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  try{enter(await api('/login',{body:{username:$('#lu').value.trim(),password:$('#lp').value}}));$('#lp').value=''}catch(_){}
});
$('#logout').addEventListener('click',async()=>{try{await api('/logout',{method:'POST',body:{}})}catch(_){};csrf='';showLogin()});
$('#burger').addEventListener('click',()=>$('#nav').classList.toggle('open'));
window.addEventListener('hashchange',()=>{if($('#app').classList.contains('on'))route()});
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString('tr-TR')},1000);
async function pingServer(){
  try{
    const d=await api('/dashboard',{quiet:true});
    const up=d.heartbeat_age!=null&&d.heartbeat_age<20;
    clear($('#srv')).append(h('span',{class:'dot '+(up?'ok':'bad')}),' ',up?'Oyun sunucusu çevrimiçi':'Oyun sunucusu kapalı / yanıt yok',' · ',fmt(d.online),' oyuncu');
  }catch(_){}
  setTimeout(()=>{if($('#app').classList.contains('on'))pingServer()},10000);
}
(async()=>{try{enter(await api('/me',{quiet:true}))}catch(_){showLogin()}})();

/* ───────── dashboard ───────── */
async function pageDashboard(main){
  const d=await api('/dashboard');
  const up=d.heartbeat_age!=null&&d.heartbeat_age<20;
  const stat=(label,val,sub)=>h('div',{class:'card stat'},h('span',{class:'mut sm'},label),h('b',{},fmt(val)),sub?h('span',{class:'mut sm'},sub):null);
  main.append(
    h('h2',{},'Genel Bakış'),
    h('div',{class:'grid stats'},
      stat('Hesap',d.accounts,'bugün +'+fmt(d.new_today)),stat('Karakter',d.characters,'Karus '+fmt(d.karus)+' · El Morad '+fmt(d.elmorad)),
      stat('Çevrimiçi',d.online),stat('Klan',d.clans),stat('Yasaklı hesap',d.banned),stat('Item şablonu',d.items),stat('Canavar şablonu',d.monsters)),
    h('div',{class:'grid cols2',style:'margin-top:12px'},
      h('div',{class:'card'},h('h3',{},'Sunucu durumu'),
        h('p',{},h('span',{class:'dot '+(up?'ok':'bad')}),' Oyun sunucusu: ',up?'çevrimiçi (son sinyal '+d.heartbeat_age+' sn önce)':'kapalı veya sinyal yok'),
        h('p',{},'Veritabanı saati: ',when(d.db_time)),
        h('p',{},'Bekleyen komut: ',fmt(d.pending_commands)),
        h('p',{class:'hint'},'Bu panel PostgreSQL ile doğrudan konuşur. Oyun sunucusu kapalıyken yapılan değişiklikler açılışta okunur; açıkken yeniden yükleme komutu sıraya alınır.')),
      h('div',{class:'card'},h('h3',{},'Son yönetici işlemleri'),
        h('div',{class:'tablewrap'},h('table',{},h('tbody',{},(d.recent_audit||[]).map(a=>h('tr',{},h('td',{class:'sm mut'},when(a.occurred_at)),h('td',{},a.actor),h('td',{},a.action),h('td',{class:'mut'},a.target))))))
      )),
    h('div',{class:'card',style:'margin-top:12px'},h('h3',{},'Çevrimiçi oyuncular'),h('div',{id:'onl','class':'tablewrap'},'Yükleniyor…')));
  const on=await api('/online');
  clear($('#onl')).append(on.length?h('table',{},h('thead',{},h('tr',{},['Karakter','Hesap','Ulus','Sınıf','Seviye','Bölge','IP'].map(x=>h('th',{},x)))),
    h('tbody',{},on.map(o=>h('tr',{class:'click',onclick:()=>location.hash='#/char/'+encodeURIComponent(o.name)},h('td',{},o.name),h('td',{},o.account),h('td',{},nationPill(o.nation)),h('td',{},o.class?className(o.class):'—'),h('td',{},o.level),h('td',{},o.zone),h('td',{class:'mut'},o.ip))))):'Şu an kimse çevrimiçi görünmüyor.');
}

/* ───────── players ───────── */
async function pagePlayers(main){
  const input=h('input',{placeholder:'Hesap, karakter adı veya e-posta ara…',style:'flex:1;min-width:220px'});
  const out=h('div',{class:'tablewrap'});
  main.append(h('h2',{},'Hesaplar & Oyuncular'),h('div',{class:'row'},input,h('button',{onclick:()=>run()},'Ara')),h('div',{class:'card',style:'margin-top:12px'},out));
  async function run(){
    const rows=await api('/accounts?q='+encodeURIComponent(input.value.trim()));
    clear(out).append(h('table',{},h('thead',{},h('tr',{},['Hesap','Karakterler','KC','TL','Yetki','Durum','Kayıt'].map(x=>h('th',{},x)))),
      h('tbody',{},rows.map(a=>h('tr',{class:'click',onclick:()=>location.hash='#/account/'+encodeURIComponent(a.account)},
        h('td',{},a.account),h('td',{},(a.chars||[]).join(', ')),h('td',{},fmt(a.kc)),h('td',{},fmt(a.tl)),
        h('td',{},a.authority<0?h('span',{class:'pill off'},'Yasaklı'):a.authority===0?h('span',{class:'pill'},'GM'):'Normal'),
        h('td',{},a.online?h('span',{class:'pill on'},'Çevrimiçi'):''),h('td',{class:'sm mut'},when(a.created)))))));
    if(!rows.length)out.append(h('p',{class:'mut'},'Sonuç yok.'));
  }
  input.addEventListener('input',debounce(run,300));input.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
  run();input.focus();
}
async function pageAccount(main,[id]){
  const a=await api('/accounts/'+encodeURIComponent(id));
  main.append(
    h('div',{class:'row'},h('a',{href:'#/players'},'← Hesaplar'),h('h2',{style:'margin:0'},a.account),a.online?h('span',{class:'pill on'},'Çevrimiçi'):null,a.authority<0?h('span',{class:'pill off'},'Yasaklı'):null),
    h('div',{class:'grid cols2',style:'margin-top:12px'},
      h('div',{class:'card'},h('h3',{},'Hesap bilgileri'),
        h('p',{},'KC (cash_point): ',h('b',{},fmt(a.kc)),' · TL bakiyesi (bonus_cash_point): ',h('b',{},fmt(a.tl))),
        h('p',{class:'mut'},'Premium tipi ',a.premium,' · Kayıt ',when(a.created),' · E-posta ',a.email||'—'),
        h('p',{class:'mut'},'Son IP ',a.client_ip||'—',' · Banka altını ',fmt(a.warehouse_coins)),
        a.authority<0?h('p',{class:'mut'},'Ceza: ',when(a.punishment_date),' · ',a.punishment_days||0,' gün (0 = süresiz)'):null,
        h('div',{class:'row'},h('button',{onclick:()=>balanceDialog(a)},'KC / TL düzenle'),
          a.authority<0?h('button',{onclick:()=>banDialog(a,false)},'Yasağı kaldır'):h('button',{class:'danger',onclick:()=>banDialog(a,true)},'Hesabı yasakla')),
        h('p',{class:'hint',style:'margin-top:10px'},'Parola, mühür parolası ve OTP bilgileri bu panelde hiçbir yerde gösterilmez. Bakiye değişikliği hesap çevrimiçiyken reddedilir (oyun sunucusu kendi kopyasını tutar).')),

function ctl(label,args,danger){
  return h('button',{class:danger?'danger':'',onclick:async()=>{

  const days=e.days.map((v,i)=>h('label',{style:'flex-direction:row;display:flex;gap:4px;align-items:center'},h('input',{type:'checkbox',checked:!!v,'data-i':i}),DAYS[i]));

  const minL=num(e.min_level),maxL=num(e.max_level),loy=num(e.req_loyalty),mon=num(e.req_money);

      const T=times.map(i=>{if(!i.value)return[-1,-1];const [hh,mm]=i.value.split(':').map(Number);return[hh,mm]});
      try{const d=await api('/events/'+e.id,{body:{status:Number(st.value),times:T,days:days.map(l=>l.querySelector('input').checked?1:0),min_level:Number(minL.value),max_level:Number(maxL.value),req_loyalty:Number(loy.value),req_money:Number(mon.value),reason:why.value}});
